name: Build Naruto Senki APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;23.1.7779620"

      - name: Build debug APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-debug-APK
          path: projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
